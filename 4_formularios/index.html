<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Formulários</title>
</head>
<body>
    <!-- Aula 1 - Criando nosso formulário -->

    <h2>Formulários HTML</h2>

    <!-- Aula 2 - Atributos da tag form (adicionando action e method) -->
    <form action="/enviar/formulario" method="GET">
        <div>
            <label>Nome:</label>
            <input type="text" />
        </div>

        <!-- Aula 3 - Atributo name -->
         <div>
            <!-- Aula 4 - Atributo for na label -->
            <label for="idade">Idade:</label>
            <input type="text" name="idade" />
         </div>

        <!-- Aula 5 - Envio de form -->
         <input type="submit" value="Enviar">
    </form>
</body>
</html>
